name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-db-test:
    name: API + 数据库用例
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装框架依赖
        run: pip install -r requirements.txt

      - name: 安装被测系统依赖
        run: pip install -r sut/requirements.txt

      - name: 启动被测系统（mini-blog）
        run: |
          python sut/app.py --db /tmp/blog_ci.db &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8520/api/tags && break
            sleep 1
          done

      - name: 运行 API + DB 用例
        env:
          AUTOTEST_DB_PATH: /tmp/blog_ci.db
        run: python -m pytest -m "api or db" --reruns 1 --alluredir=reports/allure-results

      - name: 上传 Allure 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results

  ui-test:
    name: UI 用例（无头 Chrome）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装框架依赖
        run: pip install -r requirements.txt

      - name: 安装被测系统依赖
        run: pip install -r sut/requirements.txt

      # 使用与本机验证一致的 Chrome for Testing 固定版本，
      # 通过框架支持的 AUTOTEST_CHROME_BINARY 指定，驱动版本按二进制精确匹配，
      # 避免 runner 预装 Chrome 版本随机导致驱动错位
      - name: 安装 Chrome for Testing
        run: |
          wget -q https://storage.googleapis.com/chrome-for-testing-public/154.0.8037.57/linux64/chrome-linux64.zip
          unzip -q chrome-linux64.zip -d /tmp/cft
          /tmp/cft/chrome-linux64/chrome --version
          echo "AUTOTEST_CHROME_BINARY=/tmp/cft/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - name: 启动被测系统（mini-blog）
        run: |
          python sut/app.py --db /tmp/blog_ci.db &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8520/api/tags && break
            sleep 1
          done

      - name: 切换为无头浏览器
        run: |
          python - <<'EOF'
          import yaml
          with open('config/config.yaml', encoding='utf-8') as f:
              cfg = yaml.safe_load(f)
          cfg['browser']['headless'] = True
          with open('config/config.yaml', 'w', encoding='utf-8') as f:
              yaml.safe_dump(cfg, f, allow_unicode=True)
          print('browser.headless = true')
          EOF

      - name: 运行 UI 用例
        run: python run.py ui --reruns 1

      - name: 失败时输出诊断信息
        if: failure()
        run: |
          echo "===== Chrome 版本 ====="
          /tmp/cft/chrome-linux64/chrome --version || true
          echo "===== chromedriver 版本 ====="
          find ~/.wdm -type f -name chromedriver -exec {} --version \; 2>/dev/null || echo "(未找到)"
          echo "===== config.yaml 实际内容 ====="
          cat config/config.yaml
          echo "===== 框架运行日志 ====="
          tail -n 80 logs/autotest.log 2>/dev/null || echo "(无日志文件)"
          echo "===== 失败截图 ====="
          ls -la reports/screenshots/ 2>/dev/null || echo "(无截图)"
